spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**

            - id: task-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/tasks/**,/api/projects/**

server:
  port: 8080